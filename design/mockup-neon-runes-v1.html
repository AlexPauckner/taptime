<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TapTime — Neon Runes Design Mockup</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none; user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
      background: #0d0d1a;
      color: #e0e0e0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
    }

    /* iPhone Frame */
    .phone-frame {
      width: 393px;
      min-height: 852px;
      background: #0d0d1a;
      border-radius: 50px;
      border: 4px solid #2a2a3a;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    /* Status Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 28px 0;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      flex-shrink: 0;
    }
    .status-bar .time { font-weight: 700; }
    .status-bar .icons { display: flex; gap: 6px; align-items: center; font-size: 13px; }

    /* Dynamic Island */
    .dynamic-island {
      width: 126px;
      height: 36px;
      background: #000;
      border-radius: 20px;
      margin: 6px auto 0;
      flex-shrink: 0;
    }

    /* Header */
    .header {
      padding: 16px 20px 8px;
      text-align: center;
      flex-shrink: 0;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 2px;
      text-shadow: 0 0 30px rgba(139, 92, 246, 0.4);
    }
    .header .status {
      font-size: 12px;
      color: #4ade80;
      margin-top: 3px;
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 8px 16px;
      flex: 1;
      align-content: start;
    }

    /* Group Separator */
    .grid-sep {
      grid-column: 1 / -1;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.2);
      padding: 8px 2px 2px;
    }

    /* Tile Base */
    .tile {
      position: relative;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px 8px 12px;
      min-height: 100px;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.2s ease;
      overflow: hidden;
    }
    .tile:active { transform: scale(0.95); }

    /* Glow overlay on tile */
    .tile::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 18px;
      opacity: 0.12;
      background: radial-gradient(circle at 50% 30%, currentColor 0%, transparent 70%);
      pointer-events: none;
    }

    /* Icon container */
    .tile .icon {
      width: 36px;
      height: 36px;
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
    }
    .tile .icon svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 8px currentColor) drop-shadow(0 0 20px currentColor);
    }

    /* Label */
    .tile .label {
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      line-height: 1.2;
      color: rgba(255,255,255,0.85);
      position: relative;
      z-index: 1;
    }

    /* Timer display (hidden by default, shown on running) */
    .tile .timer {
      font-size: 13px;
      font-weight: 700;
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
      color: rgba(255,255,255,0.95);
      position: relative;
      z-index: 1;
      display: none;
    }
    .tile.running .timer { display: block; }
    .tile.running {
      border: 2px solid rgba(255,255,255,0.6);
      box-shadow: 0 0 25px rgba(255,255,255,0.15);
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 15px rgba(255,255,255,0.1); }
      50% { box-shadow: 0 0 35px rgba(255,255,255,0.25); }
    }

    /* ============================================ */
    /* ROW 1: Beruf — Amber → Magenta → Deep Indigo */
    /* ============================================ */
    .tile.t-kita {
      background: linear-gradient(145deg, #f59e0b 0%, #d97706 100%);
      color: #f59e0b;
    }
    .tile.t-brainstorm {
      background: linear-gradient(145deg, #c026d3 0%, #a21caf 100%);
      color: #d946ef;
    }
    .tile.t-ki-oekosystem {
      background: linear-gradient(145deg, #4f46e5 0%, #3730a3 100%);
      color: #818cf8;
    }

    /* ============================================ */
    /* ROW 2: Haushalt 1 — Emerald → Lime → Orange  */
    /* ============================================ */
    .tile.t-hausarbeit {
      background: linear-gradient(145deg, #059669 0%, #047857 100%);
      color: #34d399;
    }
    .tile.t-kochen {
      background: linear-gradient(145deg, #65a30d 0%, #4d7c0f 100%);
      color: #a3e635;
    }
    .tile.t-einkaufen {
      background: linear-gradient(145deg, #ea580c 0%, #c2410c 100%);
      color: #fb923c;
    }

    /* ============================================ */
    /* ROW 3: Projekte — Rose → Indigo → Violet     */
    /* ============================================ */
    .tile.t-kinder {
      background: linear-gradient(145deg, #e11d48 0%, #be123c 100%);
      color: #fb7185;
    }
    .tile.t-eiinh {
      background: linear-gradient(145deg, #6366f1 0%, #4f46e5 100%);
      color: #a5b4fc;
    }
    .tile.t-bilderbuch {
      background: linear-gradient(145deg, #7c3aed 0%, #6d28d9 100%);
      color: #c4b5fd;
    }

    /* ============================================ */
    /* ROW 4: Persoenlich — Gold → Teal → Emerald   */
    /* ============================================ */
    .tile.t-jasmin {
      background: linear-gradient(145deg, #eab308 0%, #ca8a04 100%);
      color: #fde047;
    }
    .tile.t-freizeit {
      background: linear-gradient(145deg, #0d9488 0%, #0f766e 100%);
      color: #5eead4;
    }
    .tile.t-sport {
      background: linear-gradient(145deg, #16a34a 0%, #15803d 100%);
      color: #4ade80;
    }

    /* Bottom Nav */
    .nav {
      display: flex;
      border-top: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
      padding: 8px 0 28px;
      background: rgba(13,13,26,0.95);
      backdrop-filter: blur(20px);
    }
    .nav-btn {
      flex: 1;
      padding: 8px 0;
      text-align: center;
      color: #555;
      font-size: 10px;
      font-weight: 600;
      background: none;
      border: none;
      cursor: pointer;
    }
    .nav-btn .nav-icon { font-size: 22px; display: block; margin-bottom: 2px; }
    .nav-btn.active { color: #fff; }

    /* Design variant label */
    .variant-label {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(139,92,246,0.15);
      border: 1px solid rgba(139,92,246,0.3);
      color: #a78bfa;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>

    <!-- Bottom Nav -->
    <nav class="nav">
      <button class="nav-btn active">
        <span class="nav-icon">⏱️</span>Timer
      </button>
      <button class="nav-btn">
        <span class="nav-icon">📊</span>Heute
      </button>
      <button class="nav-btn">
        <span class="nav-icon">💾</span>Export

    </nav>
  </div>

</body>
</html>
